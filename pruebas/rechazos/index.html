<style>
:root{
  --bg:#E9EDF1; --panel:#FFFFFF; --panel2:#F4F6F8; --line:#D3DAE1; --ink:#16212B; --muted:#5A6774;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,"Segoe UI",Arial,sans-serif;padding-bottom:70px}

.logo{width:40px;height:40px;border:2px solid #fff;display:grid;place-items:center;font:300 19px "Century Gothic",Arial,sans-serif;color:#fff;flex:none}
.tt{min-width:0;flex:1}
.tt h1{margin:0;font-size:17px;line-height:1.15;font-weight:700;letter-spacing:.01em}
.tt p{margin:1px 0 0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}

/* alarmas */

.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin:0}

.ok-box{text-align:center;padding:30px 16px}

.cfgt td,.cfgt th{white-space:nowrap}.cfgt tbody tr{cursor:default}.cfgt input[type=checkbox]{width:20px;height:20px}

.modo span{font-size:34px;line-height:1}.modo b{font-size:18px;color:var(--navy)}.modo small{color:var(--muted);font-size:13.5px}
.nomOk{font-size:13px;font-weight:700;color:var(--ok)}.nomMal{font-size:13px;font-weight:700;color:var(--bad)}
.quien{display:flex;align-items:center;gap:14px;border:2px solid var(--accent);background:var(--accent-soft)}
.quien>span{font-size:30px}.quien small{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}.quien b{display:block;font-size:18px;color:var(--navy);overflow-wrap:anywhere}
.entrar{max-width:440px;margin:24px auto;text-align:center}.entrar .ic{font-size:46px;display:block}.entrar form{display:flex;flex-direction:column;gap:10px;margin-top:8px;text-align:left}
body.modoRep #li-cuenta{display:none!important}
footer.pie{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 0}

<script>
'use strict';
// ====================== utilidades ======================
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hoyISO = () => fechaISO(new Date());
function fechaISO(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function fmtF(iso) { if (!iso) return ''; const [y, m, d] = String(iso).slice(0, 10).split('-'); return d && m ? d + '/' + m + '/' + y : iso; }
function aFecha(iso) { const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
const num = v => { const n = parseFloat(String(v || '').replace(',', '.')); return isFinite(n) ? n : 0; };

const SEISM = [['material', 'Material'], ['maquina', 'Máquina'], ['manoObra', 'Mano de obra'], ['medioAmbiente', 'Medio ambiente'], ['medicion', 'Medición'], ['metodo', 'Método']];

const DIAS_SEM = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

const DEF_CFG = {

  catalogos: {

  }

let DB = null;

function guardarLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function leerLocal(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }

// ====================== modo demostración (sin Firebase) ======================
function prepararDemo() {
  let A = leerLocal('rech_demo', null);
  if (!A) A = { 'config/personal': { p: Object.assign({ '1234': { n: 'ANETTE RANGEL (EJEMPLO)', r: 'usuario', a: true } }, window.LI_PERSONAL_INICIAL) } };
  const subs = [];
  const guardar = () => { guardarLocal('rech_demo', A); subs.forEach(f => f()); };
  const copia = o => o == null ? o : JSON.parse(JSON.stringify(o));
  const snapDoc = p => ({ id: p.split('/').pop(), exists: p in A, data: () => copia(A[p]) });
  const doc = p => ({ id: p.split('/').pop(),
    get: async () => snapDoc(p), set: async d => { A[p] = copia(d); guardar(); },
    update: async d => { A[p] = Object.assign(A[p] || {}, copia(d)); guardar(); }, delete: async () => { delete A[p]; guardar(); },
    onSnapshot: n => { const f = () => n(snapDoc(p)); subs.push(f); f(); return () => {}; } });
  const col = c => ({
    doc: id => doc(c + '/' + (id || Math.random().toString(36).slice(2, 12))),
    add: async d => { const r = doc(c + '/' + Math.random().toString(36).slice(2, 12)); await r.set(d); return r; },
    onSnapshot: n => { let prev = new Set(); const f = () => {
      const ks = Object.keys(A).filter(k => k.startsWith(c + '/') && k.split('/').length === c.split('/').length + 1);
      const ch = ks.filter(k => !prev.has(k)).map(k => ({ type: 'added', doc: snapDoc(k) })).concat([...prev].filter(k => !(k in A)).map(k => ({ type: 'removed', doc: snapDoc(k) })));
      ks.filter(k => prev.has(k)).forEach(k => ch.push({ type: 'modified', doc: snapDoc(k) }));
      prev = new Set(ks); n({ docs: ks.map(snapDoc), docChanges: () => ch, size: ks.length }); };
      subs.push(f); f(); return () => {}; } });

function histVigente() { return S.hist.filter(r => !(S.elim[r.id] && !S.elim[r.id].restaurado)); }
function todos() { return histVigente().concat(Object.values(S.nc)); }
function abiertas() { return Object.values(S.nc).filter(r => r.estado !== 'cerrada'); }
function diasAbierta(r) { if (r.estado === 'cerrada') return 0; const t = r.creado ? new Date(r.creado) : aFecha(r.fecha); return Math.floor((Date.now() - t.getTime()) / DIA_MS); }

function vencidas() { return abiertas().filter(r => diasAbierta(r) > umbral()).sort((a, b) => diasAbierta(b) - diasAbierta(a)); }
function piezasRech(r) { return (r.piezas || []).reduce((s, p) => s + num(p.rechazada), 0); }

function piezasTxt(r) { return (r.piezas || []).map(p => [p.pieza, p.modelo].filter(Boolean).join(' · ')).filter(Boolean).join(' / '); }
function defin(r) { const d = norm(r.definicion); if (!d) return ''; if (d.includes('RETR') && (d.includes('NG') || d.includes('N/G'))) return 'RETRABAJO / NG'; if (d.includes('RETR')) return 'RETRABAJO'; if (d === 'NG' || d === 'N/G' || d.includes('NG')) return 'NG'; return d; }

// agrupa y cuenta (clave normalizada, se muestra la forma más común)
function contar(lista, fn, peso) {
  const m = new Map();
  lista.forEach(r => { const vals = [].concat(fn(r)).filter(Boolean); vals.forEach(v => { const k = norm(v); if (!k) return; const e = m.get(k) || { k, l: v, n: 0, formas: {} }; e.n += peso ? peso(r) : 1; e.formas[v] = (e.formas[v] || 0) + 1; m.set(k, e); }); });
  return [...m.values()].map(e => { e.l = Object.entries(e.formas).sort((a, b) => b[1] - a[1])[0][0]; return e; }).sort((a, b) => b.n - a.n);
}
function enRango(lista, desde, hasta) { return lista.filter(r => r.fecha && r.fecha >= desde && r.fecha <= hasta); }
function rangoFiltro() {
  const f = S.filtro, hoy = hoyISO();
  if (f.per === 'rango' && f.desde && f.hasta) return [f.desde, f.hasta];
  if (f.per === 'mes') return [hoy.slice(0, 8) + '01', hoy];
  if (f.per === 'anio') return [hoy.slice(0, 4) + '-01-01', hoy];
  if (f.per === 'todo') return ['2000-01-01', '2999-12-31'];
  const d = new Date(); d.setDate(d.getDate() - (Number(f.per) || 30) + 1); return [fechaISO(d), hoy];
}

let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
document.addEventListener('pointerdown', () => audio(), { once: true });
function tono(f, t0, dur, vol, tipo) { const a = audio(); if (!a) return; const o = a.createOscillator(), g = a.createGain(); o.type = tipo || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, a.currentTime + t0); g.gain.linearRampToValueAtTime(vol, a.currentTime + t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + t0 + dur); o.connect(g).connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + .05); }
function ding() { tono(880, 0, .35, .07); tono(1320, .12, .45, .05); }                       // aviso discreto: reporte nuevo
function sirena() { for (let i = 0; i < 3; i++) { tono(740, i * .55, .25, .28, 'square'); tono(988, i * .55 + .25, .25, .28, 'square'); } } // alarma: vencidas
function toast(tit, txt, fn, ms) {
  const d = document.createElement('div'); d.className = 'toast'; d.innerHTML = '<b>' + esc(tit) + '</b>' + esc(txt);
  d.onclick = () => { d.remove(); if (fn) fn(); }; $('#toasts').appendChild(d); setTimeout(() => d.remove(), ms || 7000);
}
function avisoSistema(tit, cuerpo, tag, silencioso) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const o = { body: cuerpo, tag, icon: 'icono-192.png', silent: !!silencioso, renotify: !silencioso };
  if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification(tit, o)).catch(() => { try { new Notification(tit, o); } catch (e) {} });
  else { try { new Notification(tit, o); } catch (e) {} }
}

function revisarAlarmas() {

  if (!S.yo || !S.yo.admin || S.modo !== 'consulta') { bar.hidden = true; mb.hidden = true; return; }

    bar.innerHTML = '<span class="pulse"></span><span>' + v.length + ' no conformidad' + (v.length > 1 ? 'es' : '') + ' con más de ' + umbral() + ' días sin cerrar · la más antigua N° ' + esc(v[0].no) + ' (' + diasAbierta(v[0]) + ' días)' + (top ? ' · más generadas por ' + esc(top.l) : '') + '</span>' +

    const sil = leerLocal('rech_silencio', 0), ult = leerLocal('rech_ultAlarma', 0);
    if ((S.cfg.alertas || {}).sonido !== false && Date.now() > sil && Date.now() - ult > 15 * 60000) {

      avisoSistema('⚠ ' + v.length + ' NC vencidas', 'Más de ' + umbral() + ' días sin cerrar. La más antigua: N° ' + v[0].no + ' · ' + origen(v[0]) + ' — ' + (v[0].defecto || ''), 'nc-vencidas', false);
    }

function idEquipo() { let id = leerLocal('rech_equipo', ''); if (!id) { id = Math.random().toString(36).slice(2, 12); guardarLocal('rech_equipo', id); } return id; }

function barras(lista, max) {

function semanas(lista, n) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0); const lun = new Date(hoy); lun.setDate(hoy.getDate() - ((hoy.getDay() + 6) % 7));
  const out = []; for (let i = n - 1; i >= 0; i--) { const a = new Date(lun); a.setDate(lun.getDate() - 7 * i); const b = new Date(a); b.setDate(a.getDate() + 6);
    const A = fechaISO(a), B = fechaISO(b); out.push({ a: A, b: B, l: fmtF(A).slice(0, 5), n: lista.filter(r => r.fecha >= A && r.fecha <= B).length }); }
  return out;
}

    sem.map((s, i) => { const h = s.n / m * (H - 22), x = i * bw + bw * .18, y = H - h;
      return '<rect x="' + x + '" y="' + y + '" width="' + bw * .64 + '" height="' + h + '" rx="3" fill="' + (i === sem.length - 1 ? '#F5B700' : '#1F6FB2') + '"/>' +
        '<text x="' + (x + bw * .32) + '" y="' + (y - 5) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#16212B" font-family="IBM Plex Mono,monospace">' + s.n + '</text>' +

    '<line x1="0" x2="' + W + '" y1="' + H + '" y2="' + H + '" stroke="#D3DAE1"/></svg></div><p class="muted small" style="margin:4px 0 0">Semanas de lunes a domingo (fecha = inicio de semana). La barra amarilla es la semana actual.</p>';

async function guardarCfg(parte, sel) {
  const m = sel ? $(sel) : null; if (m) { m.className = 'msg'; m.textContent = 'Guardando…'; }
  const nuevo = Object.assign({}, S.cfg, parte);
  try { await DB.doc('config/ajustes').set(nuevo); if (m) { m.className = 'msg o'; m.textContent = '✔ Guardado'; } }
  catch (e) { if (m) { m.className = 'msg e'; m.textContent = e.message || e.code; } throw e; }
}

const cargadas = {};
function cargarJS(src) { if (!cargadas[src]) cargadas[src] = new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => { delete cargadas[src]; mal(new Error('No se pudo cargar ' + src)); }; document.head.appendChild(s); }); return cargadas[src]; }
function descargarBlob(blob, nombre) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }

// ====================== Excel anual: un archivo por año que se actualiza (no se generan copias) ======================
// En Chrome/Edge de computadora se elige una vez dónde guardarlo y después se reescribe ese mismo archivo
// (el permiso se guarda en IndexedDB por año). En teléfonos se descarga con nombre fijo del año.
const MESES = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
const MES3 = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
const nombreXls = a => 'Concentrado No Conformidades F-CAL-08 ' + a + '.xlsx';
const puedeElegirArchivo = () => 'showSaveFilePicker' in window && window.self === window.top;
function idb() { return new Promise((ok, mal) => { const r = indexedDB.open('rech_archivos', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); }); }
async function idbGet(k) { try { const d = await idb(); return await new Promise(ok => { const q = d.transaction('h').objectStore('h').get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } }
async function idbSet(k, v) { try { const d = await idb(); await new Promise(ok => { const t = d.transaction('h', 'readwrite'); t.objectStore('h').put(v, k); t.oncomplete = ok; t.onerror = ok; }); } catch (e) {} }
function aniosDisponibles() { const s = new Set(todos().map(r => (r.fecha || '').slice(0, 4)).filter(Boolean)); s.add(hoyISO().slice(0, 4)); return [...s].sort().reverse(); }

  }
  if (!compartido) {
    descargarBlob(r.blob, r.nombre);
    location.href = 'mailto:' + c.dest.map(encodeURIComponent).join(',') + '?subject=' + encodeURIComponent(asunto) + '&body=' + encodeURIComponent(cuerpo + '\n\n(Adjuntar el PDF descargado: ' + r.nombre + ')');
    toast('Correo', 'Se descargó el PDF y se abrió el correo con los destinatarios. Adjunta el PDF y envía.', null, 10000);

}

// ====================== arranque ======================
async function iniciar() {
  if (window.DEMO) prepararDemo();
  DB = await window.claude.use('db');
  if (!DB) { $('#cargando').innerHTML = '<p class="msg e">No se pudo conectar con la base de datos.</p>'; return; }
  let primero = true;
  const listoTodo = () => {
    if (!primero || !S.yo || !S.listo) return; primero = false; $('#cargando').hidden = true;
    S.modo = leerLocal('rech_modo', '');
    if (S.modo === 'consulta' && !S.yo.ver) S.modo = 'reporte';
    if (!S.modo) { if (S.yo.admin) { irA('reporte'); elegirModo(false); return; } S.modo = 'reporte'; guardarLocal('rech_modo', 'reporte'); }
    irA(S.modo === 'consulta' ? (leerLocal('rech_vista', '') || (S.yo.admin ? 'tablero' : 'base')) : 'reporte'); resumenDelDia(); revisarAlarmas();
  };
  DB.doc('config/personal').onSnapshot(s => { S.personal = ((s.data && s.data()) || {}).p || {}; yoActual(); if (!primero) { pestanas(); if (S.vista === 'config') pintarConfig(); } listoTodo(); });
  DB.doc('config/ajustes').onSnapshot(s => { const d = (s.data && s.data()) || {}; S.cfg = { alertas: Object.assign({}, DEF_CFG.alertas, d.alertas), correo: Object.assign({}, DEF_CFG.correo, d.correo), catalogos: Object.assign({}, DEF_CFG.catalogos, d.catalogos) }; if (!primero) refrescar(); });
  DB.collection('nc').onSnapshot(q => {
    q.docChanges().forEach(c => { if (c.type === 'removed') delete S.nc[c.doc.id]; else { S.nc[c.doc.id] = Object.assign(c.doc.data() || {}, { id: c.doc.id }); if (c.type === 'added') nuevaNC(S.nc[c.doc.id]); } });
    S.listo = true; if (!primero) refrescar(); listoTodo();
  }, e => { $('#cargando').innerHTML = '<p class="msg e">No se pudo leer la base de datos: ' + esc(e.message || e.code) + '</p>'; });
  // registro de lo eliminado (errores de captura, pruebas, duplicados); también oculta rechazos del histórico
  DB.collection('eliminados').onSnapshot(q => {
    q.docChanges().forEach(c => { if (c.type === 'removed') delete S.elim[c.doc.id]; else S.elim[c.doc.id] = Object.assign(c.doc.data() || {}, { id: c.doc.id }); });
    if (!primero) { refrescar(); if (S.vista === 'config') pintarEliminados(); }
  }, () => {});
  fetch('historico.json').then(r => r.json()).then(a => { S.hist = a.map(h => Object.assign(h, { id: 'H-' + h.no, h: true, estado: 'cerrada' })); if (!primero) refrescar(); }).catch(() => {});
  setInterval(revisarAlarmas, 60000);
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
iniciar();
</script>
