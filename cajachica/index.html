<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caja Chica Mantenimiento</title>
<style>
:root{
  --bg:#F3F1EA;--card:#FFFFFF;--ink:#1D2A22;--muted:#5D6B62;--line:#DDE2DB;
  --verde:#1E5B3A;--verde2:#2E7D4F;--verde-s:#E3F1E8;--menta:#BFE3CB;
  --oro:#C99A1E;--oro-s:#FBF1D6;--rojo:#B3261E;--rojo-s:#FBE4E2;--azul:#1F5E8C;--azul-s:#E2EEF7;--negro:#2B2F2C;
  --sombra:0 1px 2px rgba(20,40,28,.06),0 6px 18px rgba(20,40,28,.06);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
header.top{background:linear-gradient(120deg,#163F29,#1E5B3A 60%,#2E7D4F);color:#F4F8F2;padding:16px 0 60px}
.top .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-bottom:0}
.top h1{margin:0;font-size:25px}.top p{margin:2px 0 0;opacity:.82;font-size:14px}.top .esp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;cursor:pointer}
.chip.mal{background:#FBE4E2;color:var(--rojo);border-color:#F2B8B3}
.hero{margin-top:-46px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);gap:16px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sombra);padding:18px}
.caja{display:flex;gap:16px;align-items:center}.caja svg{flex:none}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{font-size:36px;font-weight:800;color:var(--verde);line-height:1.1}
.sub{color:var(--muted);font-size:13.5px}
.compo{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:10px 0 10px;background:#EEF0EC}
.compo i{display:block;height:100%}
.ley{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;font-size:13.5px}
.ley div{display:flex;gap:8px;align-items:center}.ley b{margin-left:auto}
.pt{width:12px;height:12px;border-radius:3px;flex:none}
.avisos{display:grid;gap:10px;margin-top:16px}
.aviso{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:11px 14px;border:1px solid;font-size:14.5px}
.aviso .e{font-size:22px;line-height:1.2}.aviso b{display:block}
.aviso.r{background:var(--rojo-s);border-color:#F2B8B3}.aviso.a{background:var(--oro-s);border-color:#EED9A0}
.aviso.i{background:var(--azul-s);border-color:#BCD5E8}.aviso.v{background:var(--verde-s);border-color:var(--menta)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 14px;border-bottom:2px solid var(--line)}
nav.tabs button{border:0;background:none;padding:10px 14px;border-radius:10px 10px 0 0;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:-2px;border-bottom:3px solid transparent;font-size:15px}
nav.tabs button.on{color:var(--verde);border-bottom-color:var(--verde);background:var(--card)}
h2{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3{margin:16px 0 8px;font-size:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.pila{display:grid;gap:16px;align-content:start}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{border:1px solid #C9D0C8;border-radius:10px;padding:9px 11px;background:#fff;font-size:15px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--verde2);border-color:transparent}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.cat{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:7px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.cat .e{display:block;font-size:24px;line-height:1.2}.cat.on{border-color:var(--verde2);background:var(--verde-s);color:var(--verde)}
.btn{border:1px solid #C9D0C8;background:#fff;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:#F4F6F2}.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#fff}.btn.pri:hover{background:#174A2F}
.btn.oro{background:var(--oro);border-color:var(--oro);color:#fff}.btn.azul{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.rojo{color:var(--rojo);border-color:#F2B8B3}.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{font-size:13.5px;min-height:1.2em;margin:0}.msg.ok{color:var(--verde2)}.msg.e{color:var(--rojo)}
.muted{color:var(--muted)}.small{font-size:13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid #EEF0EC;vertical-align:middle}
td.m,th.m{text-align:right;white-space:nowrap}
tr.tot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.ico{font-size:20px;width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;background:var(--verde-s)}
.tag{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.v{background:var(--verde-s);color:var(--verde)}.tag.a{background:var(--oro-s);color:#8A6508}.tag.r{background:var(--rojo-s);color:var(--rojo)}.tag.i{background:var(--azul-s);color:var(--azul)}
.vacio{text-align:center;padding:24px;color:var(--muted)}.vacio .e{font-size:42px;display:block}
.ent{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:#fff}
@media (max-width:700px){.ent{grid-template-columns:auto 1fr}.ent .acc{grid-column:1/-1}}
.pila .ent{grid-template-columns:auto minmax(0,1fr)}.pila .ent .acc{grid-column:1/-1}
.ent .e{font-size:28px;width:54px;height:54px;border-radius:14px;display:grid;place-items:center}
.pasos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.paso{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:#EEF0EC;color:var(--muted)}.paso.hecho{background:var(--verde-s);color:var(--verde)}
details.grupo{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px}
details.grupo>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details.grupo>summary::-webkit-details-marker{display:none}
details.grupo>summary .t{flex:1;min-width:180px}
details.grupo[open]>summary{border-bottom:1px solid var(--line)}
details.grupo .in{padding:10px 14px 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px;font-weight:700;color:var(--muted);cursor:pointer}.seg button.on{background:var(--verde);color:#fff}
.deudas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.deuda{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.deuda .cab{display:flex;gap:10px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;flex:none}
.deuda .monto{font-size:25px;font-weight:800}.deuda.pagada{opacity:.6}
.barras{display:grid;gap:9px}
.br{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.br .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .b{height:16px;border-radius:6px;background:#EEF0EC;overflow:hidden}.br .b i{display:block;height:100%;background:var(--verde2);border-radius:6px}
.br .v{font-weight:700;min-width:80px;text-align:right}
.cols-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.colsv{display:grid;gap:6px;align-items:end;height:180px}
.colsv>div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.colsv .bar{width:100%;max-width:44px;background:linear-gradient(180deg,var(--verde2),var(--verde));border-radius:6px 6px 2px 2px}
.colsv .n{font-size:10.5px;font-weight:700;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(15,30,20,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal>.card{width:min(620px,100%);max-height:92vh;overflow:auto}
.conectar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--oro-s);border:1px solid #EED9A0;border-radius:14px;padding:12px 16px;margin-top:16px}
.conectar .e{font-size:30px}
.solo-admin{border:2px dashed #D9C27A}
/* ciclo ilustrado e interacción */
.card,.ent,.deuda,.kpi{transition:transform .18s,box-shadow .18s}
.ent:hover,.deuda:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,40,28,.12)}
.compo i{transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ciclo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media (max-width:860px){.ciclo{grid-template-columns:repeat(2,minmax(0,1fr))}}
.etapa{position:relative;border:2px solid var(--line);background:#fff;border-radius:18px;padding:14px 12px 12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .18s,box-shadow .18s,border-color .18s}
.etapa:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 12px 26px rgba(20,40,28,.14)}
.etapa svg{width:86px;height:70px;transition:transform .3s}
.etapa:hover svg{transform:rotate(-4deg) scale(1.08)}
.etapa .paso-n{position:absolute;top:8px;left:10px;width:24px;height:24px;border-radius:50%;background:#EEF0EC;color:var(--muted);font-weight:800;font-size:13px;display:grid;place-items:center}
.etapa b{font-size:14.5px}.etapa .m{font-size:20px;font-weight:800}.etapa small{color:var(--muted);font-size:12.5px}
.etapa.on{border-color:var(--c);background:linear-gradient(180deg,#fff,var(--cs))}.etapa.on .paso-n{background:var(--c);color:#fff}
.etapa.on::before{content:"";position:absolute;inset:-6px;border-radius:22px;border:2px solid var(--c);opacity:.35;animation:latido 1.8s ease-out infinite}
@keyframes latido{0%{transform:scale(.97);opacity:.5}100%{transform:scale(1.04);opacity:0}}
.etapa:not(:last-child)::after{content:"➜";position:absolute;right:-15px;top:42%;font-size:18px;color:#B9C2B9;z-index:2}
@media (max-width:860px){.etapa:nth-child(2)::after{content:""}}
@media (prefers-reduced-motion:reduce){.etapa.on::before{animation:none}.etapa,.etapa svg,.compo i{transition:none}}
.resalta{animation:resalta 1.6s ease}
@keyframes resalta{0%,100%{box-shadow:var(--sombra)}30%{box-shadow:0 0 0 4px var(--oro)}}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12.5px}
</style>

if (window.DEMO) {

  const copia = o => JSON.parse(JSON.stringify(o)), avisar = () => setTimeout(() => subs.forEach(f => f()), 0);
  const docRef = p => ({ get: async () => ({ exists: p in store, data: () => copia(store[p]) }), set: async d => { store[p] = copia(d); avisar(); }, delete: async () => { delete store[p]; avisar(); },
    onSnapshot: cb => { const f = () => cb({ exists: p in store, data: () => store[p] ? copia(store[p]) : undefined }); subs.push(f); f(); } });
  const docsDe = c => Object.keys(store).filter(k => k.startsWith(c + '/') && k.split('/').length === 2).map(k => ({ id: k.split('/')[1], data: () => copia(store[k]) }));
  const colRef = c => { const q = { orderBy: () => q, limit: () => q, get: async () => ({ docs: docsDe(c).sort((a, b) => String(b.data().t).localeCompare(String(a.data().t))) }),

} else {

    '<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"><\/script>' +

    '<script src="../firebase-config.js"><\/script><script src="li-firebase.js"><\/script>');
}
</script>

<script>
// ===================== catálogos =====================
const CATS = {
  ferre: ['🔩', 'Ferretería'], elec: ['⚡', 'Eléctrico'], neum: ['💨', 'Aire / neumático'], sold: ['🔥', 'Soldadura'],
  maq: ['⚙️', 'Refacción de máquina'], herr: ['🔧', 'Herramienta'], edif: ['🏭', 'Edificio'], limp: ['🧽', 'Limpieza'],
  ofi: ['🖱️', 'Oficina'], serv: ['🛠️', 'Servicio externo'], trans: ['🚚', 'Transporte'], otro: ['📦', 'Otros']
};
const TIPOS = { recordatorio: ['📌', 'Recordatorio', 'Ya está sumado en el histórico: solo para no olvidar, no mueve la caja'], vale: ['💸', 'Préstamo de caja', 'Se le prestó dinero de la caja: baja el efectivo hasta que lo regrese'], debe: ['📝', 'Debe', 'Adeudo para control, no sale de la caja'], leDebe: ['↩️', 'Se le debe', 'Pagó de su bolsa: hay que reponérselo'] };
const ARCH_XLS = 'Concentrado Caja Chica Mantenimiento.xlsx', DIR_PDF = 'Entregas a finanzas', DIR_ACC = 'accesos';

// ===================== utilidades =====================
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const din = n => '$' + r2(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const din0 = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-MX');
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const hoyISO = () => iso(new Date());
const aFecha = s => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const dias = (desde, hasta) => Math.round((aFecha(hasta || hoyISO()) - aFecha(desde)) / 864e5);
const sumaD = (d, n) => { const x = aFecha(d); x.setDate(x.getDate() + n); return iso(x); };
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MESL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fF = s => { if (!s) return '—'; const d = aFecha(s); return d.getDate() + ' ' + MES[d.getMonth()] + ' ' + d.getFullYear(); };
const fC = s => { if (!s) return '—'; const d = aFecha(s); return d.getDate() + ' ' + MES[d.getMonth()]; };
const fN = s => { const d = aFecha(s); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); };
const fL = s => { const d = aFecha(s); return d.getDate() + ' de ' + MESL[d.getMonth()] + ' de ' + d.getFullYear(); };
// semana ISO (lunes a domingo)
function semana(s) { const d = aFecha(s), x = new Date(d); x.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const a = x.getFullYear(), p = new Date(a, 0, 4); const n = 1 + Math.round(((x - p) / 864e5 - 3 + (p.getDay() + 6) % 7) / 7); const lun = new Date(d); lun.setDate(d.getDate() - (d.getDay() + 6) % 7); return { a, n, clave: a + '-S' + String(n).padStart(2, '0'), lun: iso(lun), dom: sumaD(iso(lun), 6) }; }
const nuevoId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const COLORES = ['#1E5B3A', '#1F5E8C', '#8A4FB0', '#C2571A', '#0F7C7A', '#A23A5A', '#5A6B1E'];

// ===================== estado (vive en Firebase: apps/cajachica/) =====================
// Colecciones: facturas, entregas, solicitudes (vales), deudas, conteos, eliminados, accesos · config/ajustes · config/personal
const COLS = ['facturas', 'entregas', 'solicitudes', 'deudas', 'conteos', 'eliminados'];
const AJUSTES = ['fondo', 'responsable', 'diasEntrega', 'diasCheque', 'alertaPct'];
const VACIO = () => ({ fondo: 9000, responsable: 'AMÍLCAR OMAR ANDRACA HERRERA', diasEntrega: 7, diasCheque: 7, alertaPct: 30, usuarios: {}, facturas: [], entregas: [], solicitudes: [], deudas: [], conteos: [], eliminados: [] });
let D = VACIO(), DB = null, YO = null, tab = 'principal', carpeta = null, errorArch = '';
const listo = {}, ULT = {}; COLS.forEach(c => ULT[c] = {}); let ULT_AJ = '', ULT_US = '';
// texto canónico (llaves ordenadas) para saber si un registro cambió
const canon = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, y) => (o[y] = x[y], o), {}) : x);
const limpio = o => JSON.parse(JSON.stringify(o));

async function conectar() {
  DB = await window.claude.use('db'); if (!DB) return;
  const nom = window.LI.nomina();
  DB.doc('config/personal').onSnapshot(s => {
    const p = (s.data() || {}).p || {}, u = p[nom];
    D.usuarios = p; ULT_US = canon(p);
    YO = u ? { nom, n: u.n, rol: u.r === 'admin' || u.r === 'general' ? 'admin' : 'consulta', general: u.r === 'general', cargar: !!u.cargar, eliminar: !!u.eliminar } : null;
    listo.per = true; refrescar();
  });
  DB.doc('config/ajustes').onSnapshot(s => { const a = s.data() || {}; AJUSTES.forEach(k => { if (a[k] != null) D[k] = a[k]; }); ULT_AJ = canon(AJUSTES.map(k => D[k])); listo.aj = true; refrescar(); }, () => { listo.aj = true; refrescar(); });
  COLS.forEach(c => DB.collection(c).onSnapshot(q => {
    D[c] = q.docs.map(d => Object.assign({}, d.data(), { id: d.id })).sort((a, b) => c === 'entregas' ? a.n - b.n : String(a.fecha || a.t || '').localeCompare(String(b.fecha || b.t || '')) || a.id.localeCompare(b.id)); ULT[c] = {}; D[c].forEach(x => ULT[c][x.id] = canon(x)); listo[c] = true; refrescar();
  }, () => { listo[c] = true; refrescar(); }));
  registrarAcceso(nom);
}
let tR;
function refrescar() { clearTimeout(tR); tR = setTimeout(() => { if (listo.per && COLS.every(c => listo[c])) { pintar(); revisarViernes(); } }, 60); }

// guardar = mandar a Firebase solo lo que cambió (así varios pueden capturar a la vez sin pisarse)
let enviando = Promise.resolve();
function guardar() { pintar(); enviando = enviando.then(sincronizar).catch(e => toast('No se pudo guardar: ' + (e.message || e.code || e))); }
async function sincronizar() {
  if (!DB) return; const ops = [];
  for (const c of COLS) {
    const vivos = {};
    for (const x of D[c]) {
      if (!x.id) x.id = nuevoId(c.slice(0, 2)); vivos[x.id] = 1;
      const j = canon(x); if (ULT[c][x.id] !== j) { ULT[c][x.id] = j; const datos = limpio(x); delete datos.id; ops.push(DB.doc(c + '/' + x.id).set(datos)); }
    }
    Object.keys(ULT[c]).forEach(id => { if (!vivos[id]) { delete ULT[c][id]; ops.push(DB.doc(c + '/' + id).delete()); } });
  }
  if (esAdmin()) {
    const aj = canon(AJUSTES.map(k => D[k])); if (aj !== ULT_AJ) { ULT_AJ = aj; const o = {}; AJUSTES.forEach(k => o[k] = D[k]); ops.push(DB.doc('config/ajustes').set(o)); }
    const us = canon(D.usuarios); if (us !== ULT_US) { ULT_US = us; ops.push(DB.doc('config/personal').set({ p: limpio(D.usuarios) })); }
  }
  await Promise.all(ops);
}

function importar(x) {

const soporta = 'showDirectoryPicker' in window;
const IDB = () => new Promise((ok, mal) => { const r = indexedDB.open('cajaChicaWeb', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); });
const conLimite = (p, ms) => Promise.race([p, new Promise(ok => setTimeout(() => ok(null), ms))]);
const idbGet = k => conLimite((async () => { try { const db = await IDB(); return await new Promise(ok => { const q = db.transaction('h').objectStore('h').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); } catch (e) { return null; } })(), 2000);
const idbSet = async (k, v) => { try { const db = await IDB(); await new Promise(ok => { const t = db.transaction('h', 'readwrite'); t.objectStore('h').put(v, k); t.oncomplete = ok; t.onerror = ok; }); } catch (e) {} };
async function escribirArchivo(nombre, contenido, sub) {
  let dir = carpeta; if (sub) dir = await carpeta.getDirectoryHandle(sub, { create: true });
  const fh = await dir.getFileHandle(nombre, { create: true }); const w = await fh.createWritable(); await w.write(contenido); await w.close(); return fh;
}

  catch (e) { if (e.name !== 'AbortError') { errorArch = e.message; pintar(); } return false; }
}
// se llama desde un clic (el navegador solo pide permiso con un clic)
async function pedirPermiso() {

  try { if ((await h.requestPermission({ mode: 'readwrite' })) === 'granted') { carpeta = h; pintar(); return true; } } catch (e) { errorArch = e.message; }
  return elegirCarpeta();
}

function descargar(blob, nombre) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000); }

// ===================== cálculos =====================
const esAdmin = () => !!(YO && YO.rol === 'admin');
const puedeCargar = () => esAdmin() || !!(YO && YO.cargar);
const puedeEliminar = () => esAdmin() || !!(YO && YO.eliminar);
const porEntregar = () => D.facturas.filter(x => !x.entrega).sort((a, b) => a.fecha.localeCompare(b.fecha));
const facDe = id => D.facturas.filter(x => x.entrega === id).sort((a, b) => a.fecha.localeCompare(b.fecha));
const suma = L => r2(L.reduce((s, x) => s + Number(x.monto || 0), 0));
const saldoDeuda = d => Math.max(0, Number(d.monto || 0) - (d.abonos || []).reduce((s, a) => s + Number(a.monto || 0), 0));
function cuentas() {
  const pe = suma(porEntregar());
  const espera = D.entregas.filter(e => !e.cheque), enEspera = r2(espera.reduce((s, e) => s + suma(facDe(e.id)), 0));
  const sol = r2(D.solicitudes.filter(s => s.estado === 'pendiente').reduce((s, x) => s + Number(x.monto || 0), 0));
  const vales = r2(D.deudas.filter(d => d.tipo === 'vale').reduce((s, d) => s + saldoDeuda(d), 0));
  const caja = r2(D.fondo - pe - enEspera - sol - vales);
  return { pe, enEspera, espera, sol, vales, caja };
}

// ===================== avisos con fechas =====================
function avisos() {
  const A = [], c = cuentas(), hoy = hoyISO(), pe = porEntregar();
  if (pe.length) {
    const n = dias(pe[0].fecha);
    if (n >= D.diasEntrega) A.push(['r', '📤', 'Toca entregar facturas a finanzas', 'Tienes ' + pe.length + ' facturas por ' + din(c.pe) + '. La más antigua es del ' + fF(pe[0].fecha) + ' (hace ' + n + ' días).']);
    else A.push(['i', '🧾', pe.length + ' facturas esperando entrega: ' + din(c.pe), 'Desde el ' + fF(pe[0].fecha) + '. Entrega sugerida antes del ' + fF(sumaD(pe[0].fecha, D.diasEntrega)) + '.']);
    const fut = pe.filter(x => x.fecha > hoy); if (fut.length) A.push(['a', '📆', 'Revisa la fecha de ' + fut.length + ' factura(s)', fut.map(x => x.proveedor + ' (' + fF(x.fecha) + ')').join(' · ') + ' tienen fecha futura.']);
  }
  c.espera.forEach(e => { const n = dias(e.fecha); A.push([n > D.diasCheque ? 'r' : 'a', '🏦', n > D.diasCheque ? 'Finanzas lleva ' + n + ' días sin dar el cheque' : 'En espera del cheque de devolución', 'Entrega N° ' + e.n + ' del ' + fF(e.fecha) + ' por ' + din(suma(facDe(e.id))) + '.']); });
  if (c.caja < D.fondo * D.alertaPct / 100) A.push(['r', '🪫', 'Queda poco efectivo en la caja negra', 'Deben quedar ' + din(c.caja) + ' (menos del ' + D.alertaPct + ' % del fondo). Entrega facturas para que repongan.']);
  if (esAdmin()) D.solicitudes.filter(s => s.estado === 'pendiente').forEach(s => { const n = dias(s.fecha); if (n >= 2) A.push(['a', '📝', s.persona + ' no ha traído factura (' + din(s.monto) + ')', 'Se le dio el ' + fF(s.fecha) + ' (hace ' + n + ' días) para: ' + s.motivo + '.']); });
  D.deudas.filter(d => d.tipo !== 'recordatorio' && saldoDeuda(d) > 0).forEach(d => {
    const quien = d.tipo === 'leDebe' ? 'Se le debe a ' + d.persona : d.persona + ' debe';
    if (d.compromiso && d.compromiso < hoy) A.push(['r', '⏰', quien + ' ' + din(saldoDeuda(d)) + ': ya venció', 'Quedó de pagarse el ' + fF(d.compromiso) + ' (hace ' + dias(d.compromiso) + ' días).']);
    else if (d.compromiso && dias(hoy, d.compromiso) <= 2) A.push(['a', '⏳', quien + ' ' + din(saldoDeuda(d)) + ': vence pronto', 'Fecha de pago: ' + fF(d.compromiso) + '.']);
  });
  const uc = D.conteos[D.conteos.length - 1];
  if (esAdmin() && (!uc || dias(uc.fecha) >= 7)) A.push(['i', '🔍', 'Cuenta la caja negra', uc ? 'El último conteo fue el ' + fF(uc.fecha) + ' (hace ' + dias(uc.fecha) + ' días).' : 'Aún no hay conteo registrado. Usa el botón "Contar caja negra".']);
  if (!A.some(a => a[0] === 'r' || a[0] === 'a')) A.unshift(['v', '✅', 'Todo en orden', 'No hay pendientes vencidos.']);
  const o = { r: 0, a: 1, i: 2, v: 3 }; return A.sort((x, y) => o[x[0]] - o[y[0]]);
}

// el número sube o baja contando hasta el valor nuevo
function animarNum(el, v) {
  const de = Number(el.dataset.v || 0); el.dataset.v = v;
  if (de === v || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = din(v); return; }
  const t0 = performance.now(), dur = 900;
  const paso = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = din(de + (v - de) * e); if (k < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}

// eliminar una factura: pide el motivo y deja registro (el historial de eliminación solo lo ve el administrador)
const MOTIVOS = ['Error de captura', 'Factura duplicada', 'Se canceló la compra', 'Monto o datos equivocados', 'Otro'];
function dlgEliminar(x) {

    '<form class="form"><label class="f full">¿Por qué se elimina?<select name="mo" required><option value="">Elige el motivo…</option>' + MOTIVOS.map(o => '<option>' + o + '</option>').join('') + '</select></label>' +
    '<label class="f full">Explica (obligatorio si es "Otro")<input name="de" placeholder="Ej. se capturó dos veces"></label>' +
    '<p class="small muted full" style="margin:0">Queda registrado quién la eliminó, cuándo y por qué.</p><p class="msg e full" id="elMsg"></p>' +
    '<div class="full row"><button class="btn rojo" type="submit">🗑 Eliminar</button><button class="btn" type="button" data-x>Cancelar</button></div></form>');
  $('form', m).onsubmit = e => {
    e.preventDefault(); const mo = e.target.mo.value, de = e.target.de.value.trim();
    if (!mo || (mo === 'Otro' && !de)) { $('#elMsg', m).textContent = 'Escribe el motivo.'; return; }
    const datos = Object.assign({}, x); delete datos.id;
    D.eliminados.push({ id: nuevoId('el'), tipo: 'factura', ref: x.id, t: new Date().toISOString(), fecha: hoyISO(), por: YO.nom, porN: YO.n, motivo: mo, detalle: de, datos, restaurado: false });
    D.facturas = D.facturas.filter(y => y !== x); m.remove(); guardar(); toast('Factura eliminada: quedó en el historial de eliminación.');
  };
}
function modal(titulo, html) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="card"><h2>' + titulo + '</h2>' + html + '</div>';
  document.body.appendChild(m); m.addEventListener('click', e => { if (e.target === m) m.remove(); });
  $$('[data-x]', m).forEach(b => b.onclick = () => m.remove()); return m;
}

// ---------- PDF (jsPDF local en lib\)
async function generarPDF(en, lista, previa) {
  const L = lista || facDe(en.id), t = suma(L);
  if (!window.jspdf) { alert('No se encontró la librería de PDF (carpeta lib).'); return; }
  const { jsPDF } = window.jspdf, doc = new jsPDF({ unit: 'mm', format: 'letter' }), W = 215.9;

function pDeben() {
  const adm = esAdmin(), act = D.deudas.filter(d => d.tipo !== 'recordatorio' && saldoDeuda(d) > 0), rec = adm ? D.deudas.filter(d => d.tipo === 'recordatorio' && saldoDeuda(d) > 0) : [], pag = D.deudas.filter(d => saldoDeuda(d) <= 0 && (adm || d.tipo !== 'recordatorio'));
  const tarjeta = d => { const s = saldoDeuda(d), t = TIPOS[d.tipo], venc = d.compromiso && d.compromiso < hoyISO() && s > 0;
    return '<div class="deuda' + (s <= 0 ? ' pagada' : '') + '"><div class="cab"><span class="av" style="background:' + colorDe(d.persona) + '">' + esc(d.persona.trim()[0] || '?') + '</span><div style="min-width:0"><b>' + esc(d.persona) + '</b><div class="small muted">' + t[0] + ' ' + t[1] + '</div></div></div>' +
      '<div class="monto" style="color:' + (s <= 0 ? 'var(--verde2)' : d.tipo === 'leDebe' ? 'var(--azul)' : d.tipo === 'recordatorio' ? 'var(--oro)' : 'var(--rojo)') + '">' + (s <= 0 ? '✔ Pagado' : din(s)) + '</div><div class="small">' + esc(d.concepto) + '</div>' +
      '<div class="small muted">Desde ' + fF(d.fecha) + ' (' + dias(d.fecha) + ' días)' + (d.compromiso ? ' · paga el <b style="color:' + (venc ? 'var(--rojo)' : 'var(--ink)') + '">' + fF(d.compromiso) + (venc ? ' ⏰ vencido' : '') + '</b>' : '') + '</div>' +
      ((d.abonos || []).length ? '<div class="small muted">Abonos: ' + d.abonos.map(a => fC(a.fecha) + ' ' + din(a.monto)).join(' · ') + '</div>' : '') +
      (adm ? '<div class="row">' + (s > 0 ? '<button class="btn sm pri" data-ab="' + d.id + '" type="button">💵 Abonar / liquidar</button>' : '') + '<button class="btn sm" data-ed="' + d.id + '" type="button">✏️</button><button class="btn sm rojo" data-bd="' + d.id + '" type="button">🗑</button></div>' : '') + '</div>'; };
  $('#t-deben').innerHTML = '<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🤝 Quién debe</h2>' + (adm ? '<button class="btn pri" id="nD" type="button">➕ Anotar adeudo o vale</button>' : '') + '</div>' +
    '<div class="row small muted" style="margin-top:8px;gap:16px">' + Object.entries(TIPOS).filter(([k]) => adm || k !== 'recordatorio').map(([, t]) => '<span>' + t[0] + ' <b>' + t[1] + ':</b> ' + t[2] + '</span>').join('') + '</div></div>' +
    (act.length ? '<div class="deudas">' + act.sort((a, b) => saldoDeuda(b) - saldoDeuda(a)).map(tarjeta).join('') + '</div>' : '<div class="card vacio"><span class="e">🎉</span>Sin vales ni adeudos que muevan la caja.</div>') +
    (rec.length ? '<h3>📌 Recordatorios <span class="tag a">🔒 solo tú los ves</span> <span class="small muted" style="font-weight:400">· ya están sumados en el histórico de caja chica, no mueven la caja negra ni los $' + Math.round(D.fondo).toLocaleString('es-MX') + '</span></h3><div class="deudas">' + rec.map(tarjeta).join('') + '</div>' : '') +
    (pag.length ? '<h3 class="muted">Ya pagados</h3><div class="deudas">' + pag.map(tarjeta).join('') + '</div>' : '');
  if (!adm) return;
  $('#nD').onclick = () => dlgDeuda();
  $$('[data-ed]').forEach(b => b.onclick = () => dlgDeuda(b.dataset.ed));
  $$('[data-bd]').forEach(b => b.onclick = () => { const d = D.deudas.find(x => x.id === b.dataset.bd); if (confirm('¿Borrar el registro de ' + d.persona + '?')) { D.deudas = D.deudas.filter(x => x !== d); guardar(); } });
  $$('[data-ab]').forEach(b => b.onclick = () => { const d = D.deudas.find(x => x.id === b.dataset.ab), s = saldoDeuda(d);
    const m = modal('💵 Abono de ' + esc(d.persona), '<p>Saldo: <b>' + din(s) + '</b></p><form class="form"><label class="f">Monto<input name="m" type="number" step="0.01" min="0.01" value="' + s.toFixed(2) + '" required></label><label class="f">Fecha<input name="f" type="date" value="' + hoyISO() + '" required></label><div class="full row"><button class="btn pri" type="submit">Registrar</button><button class="btn" type="button" data-x>Cancelar</button></div></form>');
    $('form', m).onsubmit = e => { e.preventDefault(); (d.abonos = d.abonos || []).push({ fecha: e.target.f.value, monto: r2(e.target.m.value) }); m.remove(); guardar(); }; });
}
function dlgDeuda(id) {
  const d = id ? D.deudas.find(x => x.id === id) : null;
  const m = modal(d ? '✏️ Corregir adeudo' : '➕ Anotar adeudo o vale', '<form class="form" autocomplete="off"><label class="f full">¿Quién?<input name="p" required value="' + esc(d ? d.persona : '') + '"></label>' +
    '<label class="f full">Tipo<select name="t">' + Object.entries(TIPOS).map(([k, t]) => '<option value="' + k + '"' + ((d ? d.tipo : 'vale') === k ? ' selected' : '') + '>' + t[0] + ' ' + t[1] + ' — ' + t[2] + '</option>').join('') + '</select></label>' +
    '<label class="f">Monto<input name="m" type="number" step="0.01" min="0.01" required value="' + (d ? d.monto : '') + '"></label><label class="f">Fecha<input name="f" type="date" required value="' + (d ? d.fecha : hoyISO()) + '"></label>' +
    '<label class="f">Queda de pagar el<input name="c" type="date" value="' + (d ? d.compromiso : sumaD(hoyISO(), 7)) + '"></label><label class="f">Concepto<input name="k" value="' + esc(d ? d.concepto : '') + '"></label>' +
    '<div class="full row"><button class="btn pri" type="submit">Guardar</button><button class="btn" type="button" data-x>Cancelar</button></div></form>');
  $('form', m).onsubmit = e => { e.preventDefault(); const F = e.target, v = { persona: F.p.value.trim().toUpperCase(), tipo: F.t.value, monto: r2(F.m.value), fecha: F.f.value, compromiso: F.c.value, concepto: F.k.value.trim() };
    if (d) Object.assign(d, v); else D.deudas.push(Object.assign({ id: nuevoId('d'), abonos: [] }, v)); m.remove(); guardar(); };
}

// ---------- Solicitudes de caja (solo administrador)
function pSolicitudes() {
  const pend = D.solicitudes.filter(s => s.estado === 'pendiente'), hechas = D.solicitudes.filter(s => s.estado !== 'pendiente').slice(-30).reverse();
  $('#t-solicitudes').innerHTML = '<div class="cols"><div class="card solo-admin"><h2>💵 Vales de caja sin factura <span class="tag r">' + din(cuentas().sol) + '</span></h2>' +
    '<p class="small muted" style="margin-top:0">🔒 Solo tú ves este apartado. Cuando alguien se lleva dinero (ej. un billete de $500), anótalo: se resta de la caja negra. Cuando traiga la factura y la feria, captura el monto de la factura: la feria regresa sola a la caja negra y la factura pasa a "Facturas por entregar" y ya lo ven todos.</p>' +
    (pend.length ? '<div class="tw"><table><thead><tr><th>Fecha</th><th>Quién</th><th>Para qué</th><th class="m">Se le dio</th><th></th></tr></thead><tbody>' +
      pend.map(s => '<tr><td style="white-space:nowrap">' + fN(s.fecha) + '<div class="small muted">hace ' + dias(s.fecha) + ' días</div></td><td><b>' + esc(s.persona) + '</b></td><td>' + esc(s.motivo) + '</td><td class="m"><b>' + din(s.monto) + '</b></td>' +
        '<td style="white-space:nowrap"><button class="btn sm pri" >🧾 Llegó la factura y la feria</button> <button class="btn sm" data-dev="' + s.id + '" type="button" title="Regresó todo el dinero">↩️</button></td></tr>').join('') + '</tbody></table></div>'
      : '<div class="vacio"><span class="e">👌</span>No hay vales pendientes.</div>') +
    (hechas.length ? '<h3>Comprobadas recientemente</h3><div class="tw"><table><tbody>' + hechas.map(s => '<tr><td>' + fN(s.fecha) + '</td><td>' + esc(s.persona) + '</td><td>' + esc(s.motivo) + '</td><td class="m">' + din(s.monto) + '</td><td>' + (s.estado === 'devuelta' ? '<span class="tag v">↩️ Regresó el dinero</span>' : '<span class="tag i">🧾 Factura ' + din(s.montoFactura) + '</span>' + (s.dif > 0 ? ' <span class="tag v">Regresó ' + din(s.dif) + '</span>' : s.dif < 0 ? ' <span class="tag a">Se le debe ' + din(-s.dif) + '</span>' : '')) + '</td></tr>').join('') + '</tbody></table></div>' : '') + '</div>' +
    '<div class="card solo-admin"><h2>➕ Nuevo vale</h2><form id="fS" class="form" autocomplete="off"><label class="f full">¿Quién se lleva el dinero?<input name="p" required placeholder="Nombre"></label><label class="f full">¿Para qué?<input name="m" required placeholder="Ej. comprar fusibles para Selexx"></label>' +
    '<label class="f">Se le dio ($)<input name="d" type="number" step="0.01" min="0.01" required></label><label class="f">Fecha<input name="f" type="date" value="' + hoyISO() + '" required></label>' +
    '<div class="full"><button class="btn pri" type="submit">Anotar vale (se resta de la caja negra)</button></div></form></div></div>';
  $('#fS').onsubmit = e => { e.preventDefault(); const F = e.target; D.solicitudes.push({ id: nuevoId('s'), fecha: F.f.value, persona: F.p.value.trim().toUpperCase(), motivo: F.m.value.trim(), monto: r2(F.d.value), estado: 'pendiente' }); guardar(); };
  $$('[data-fac]').forEach(b => b.onclick = () => dlgFactura(null, D.solicitudes.find(s => s.id === b.dataset.fac)));
  $$('[data-dev]').forEach(b => b.onclick = () => { const s = D.solicitudes.find(x => x.id === b.dataset.dev); if (confirm(s.persona + ' regresó los ' + din(s.monto) + ' completos (no se compró nada)?')) { s.estado = 'devuelta'; s.fechaFactura = hoyISO(); guardar(); } });
}

// ---------- Configuración (solo administrador)
async function pConfig() {
  const P = D.usuarios, filas = Object.entries(P).sort((a, b) => (a[1].n || '').localeCompare(b[1].n || ''));
  const elim = [...D.eliminados].sort((a, b) => String(b.t).localeCompare(String(a.t)));
  $('#t-config').innerHTML = '<div class="card solo-admin" style="margin-bottom:16px"><h2>👥 Perfiles y permisos</h2>' +
    '<p class="small muted" style="margin-top:0">Todos entran con su <b>nómina y contraseña</b> (la misma de Control de Paros). <b>Consulta</b>: ve principal, historial, gráficas y quién debe. Márcale <b>Cargar facturas</b> para que registre y corrija facturas, y <b>Eliminar facturas</b> para que pueda borrarlas (siempre con motivo). El <b>administrador</b> tiene todo.</p>' +
    '<div class="tw"><table><thead><tr><th>Nómina</th><th>Nombre</th><th>Perfil</th><th>Cargar facturas</th><th>Eliminar facturas</th><th>Activo</th><th>Acciones</th></tr></thead><tbody>' +
    filas.map(([k, u]) => { const yo = k === YO.nom, adm = u.r === 'admin' || u.r === 'general';
      return '<tr data-k="' + esc(k) + '"><td>' + esc(k) + '</td><td><input data-x="n" value="' + esc(u.n) + '" style="min-width:220px;padding:6px 8px;font-size:14px"></td>' +
        '<td>' + (u.r === 'general' ? '<span class="tag v">🔑 Administrador general</span>' : '<select data-x="r"' + (yo ? ' disabled' : '') + '><option value="usuario"' + (u.r === 'usuario' ? ' selected' : '') + '>👁 Consulta</option><option value="admin"' + (u.r === 'admin' ? ' selected' : '') + '>🔑 Administrador</option></select>') + '</td>' +
        '<td style="text-align:center"><input type="checkbox" data-x="cargar" style="width:20px;height:20px"' + (u.cargar || adm ? ' checked' : '') + (adm ? ' disabled' : '') + '></td>' +
        '<td style="text-align:center"><input type="checkbox" data-x="eliminar" style="width:20px;height:20px"' + (u.eliminar || adm ? ' checked' : '') + (adm ? ' disabled' : '') + '></td>' +
        '<td style="text-align:center"><input type="checkbox" data-x="a" style="width:20px;height:20px"' + (u.a !== false ? ' checked' : '') + (yo ? ' disabled' : '') + '></td>' +
        '<td style="white-space:nowrap"><button class="btn sm" data-reset="' + esc(k) + '" type="button">🔑 Contraseña</button>' + (!yo && u.r !== 'general' ? ' <button class="btn sm rojo" data-qu="' + esc(k) + '" type="button">Quitar</button>' : '') + '</td></tr>'; }).join('') +
    '</tbody></table></div><div class="row" style="margin-top:10px"><button class="btn pri" id="uGuardar" type="button">💾 Guardar permisos</button><span class="msg" id="uMsg"></span></div>' +
    '<h3>➕ Dar acceso a otra persona</h3><form id="fU" class="form"><label class="f">Nómina<input name="n" inputmode="numeric" required></label><label class="f">Nombre completo<input name="m" required></label>' +
    '<label class="f">Perfil<select name="r"><option value="usuario">👁 Consulta</option><option value="admin">🔑 Administrador</option></select></label><label class="f">Contraseña inicial (si no tiene cuenta)<input name="p" type="text" value="000000" autocomplete="off"></label>' +
    '<label class="row small"><input type="checkbox" name="c" style="width:20px;height:20px"> Cargar facturas</label><label class="row small"><input type="checkbox" name="e" style="width:20px;height:20px"> Eliminar facturas</label>' +
    '<div class="full row"><button class="btn pri" type="submit">Dar acceso</button><span class="msg" id="fUMsg"></span></div></form></div>' +

    '<div class="cols"><div class="pila"><div class="card solo-admin"><h2>⚙ Datos de la caja</h2><form id="fJ" class="form">' +
    '<label class="f">Fondo total de caja chica ($)<input name="fo" type="number" step="0.01" value="' + D.fondo + '"></label><label class="f">Responsable<input name="re" value="' + esc(D.responsable) + '"></label>' +
    '<label class="f">Avisar entregar facturas a los … días<input name="de" type="number" min="1" value="' + D.diasEntrega + '"></label><label class="f">Avisar si el cheque tarda más de … días<input name="dc" type="number" min="1" value="' + D.diasCheque + '"></label>' +
    '<label class="f">Avisar si en caja queda menos del (%)<input name="ap" type="number" min="5" max="90" value="' + D.alertaPct + '"></label>' +
    '<div class="full row"><button class="btn pri" type="submit">Guardar</button></div></form></div>' +
    '<div class="card solo-admin"><h2>🗂️ Excel, PDF y respaldo</h2><p class="small">El Excel concentrado se actualiza <b>los viernes</b>. ' + (carpeta ? '✔ En esta PC se guarda en la carpeta <b>' + esc(carpeta.name) + '</b>.' : 'Elige la carpeta <b>CAJA CHICA</b> para que el Excel y los PDF se guarden ahí (si no, se descargan).') + '</p>' +
      '<div class="row"><button class="btn" id="jCar" type="button">📂 Elegir carpeta CAJA CHICA</button><button class="btn" id="jXls" type="button">📗 Actualizar Excel ahora</button><button class="btn" id="jRes" type="button">⬇ Descargar respaldo</button><label class="btn" style="cursor:pointer">📥 Importar respaldo<input type="file" id="jImp" accept=".json,application/json" hidden></label></div></div></div>' +
    '<div class="pila"><div class="card solo-admin"><h2>🗑 Historial de eliminación <span class="tag r">🔒 solo tú</span></h2>' +
      (elim.length ? '<div class="tw" style="max-height:420px;overflow:auto"><table><thead><tr><th>Cuándo</th><th>Quién</th><th>Factura</th><th>Motivo</th><th></th></tr></thead><tbody>' +
        elim.map(e => { const d = new Date(e.t), f = e.datos || {}; return '<tr' + (e.restaurado ? ' style="opacity:.55"' : '') + '><td style="white-space:nowrap">' + d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) + '</td><td>' + esc(e.porN || e.por) + '</td>' +
          '<td><b>' + esc(f.proveedor) + '</b><div class="small muted">' + (f.fecha ? fN(f.fecha) : '') + ' · ' + din(f.monto) + '</div></td><td><b>' + esc(e.motivo) + '</b>' + (e.detalle ? '<div class="small muted">' + esc(e.detalle) + '</div>' : '') + '</td>' +
          '<td>' + (e.restaurado ? '<span class="tag v">Restaurada</span>' : '<button class="btn sm" data-rest="' + e.id + '" type="button">↩️ Restaurar</button>') + '</td></tr>'; }).join('') + '</tbody></table></div>'
        : '<div class="vacio" style="padding:12px"><span class="e">🧹</span>No se ha eliminado nada.</div>') + '</div>' +
    '<div class="card solo-admin"><h2>🚪 Historial de entradas <span class="tag r">🔒 solo tú</span></h2><div id="accesos" class="small muted">Leyendo…</div></div></div></div>';

  // perfiles
  $$('#t-config [data-x=r]').forEach(s => s.onchange = () => { const tr = s.closest('tr'), adm = s.value === 'admin'; ['cargar', 'eliminar'].forEach(x => { const c = $('[data-x=' + x + ']', tr); c.disabled = adm; if (adm) c.checked = true; }); });
  $('#uGuardar').onclick = () => {
    $$('#t-config tr[data-k]').forEach(tr => { const u = D.usuarios[tr.dataset.k]; u.n = $('[data-x=n]', tr).value.trim().toUpperCase() || u.n;
      const r = $('[data-x=r]', tr); if (r && !r.disabled) u.r = r.value;
      const adm = u.r === 'admin' || u.r === 'general'; u.cargar = adm || $('[data-x=cargar]', tr).checked; u.eliminar = adm || $('[data-x=eliminar]', tr).checked;
      const a = $('[data-x=a]', tr); if (!a.disabled) u.a = a.checked; });
    guardar(); toast('✔ Permisos guardados');
  };
  $$('#t-config [data-reset]').forEach(b => b.onclick = () => window.LI.dialogoRestablecer(b.dataset.reset, (D.usuarios[b.dataset.reset] || {}).n));
  $$('#t-config [data-qu]').forEach(b => b.onclick = () => { const k = b.dataset.qu; if (confirm('¿Quitar el acceso de ' + D.usuarios[k].n + '? Ya no podrá entrar a la caja chica.')) { delete D.usuarios[k]; guardar(); } });
  $('#fU').onsubmit = async e => {
    e.preventDefault(); const F = e.target, k = F.n.value.trim(), m = $('#fUMsg');
    if (!/^\d{1,8}$/.test(k)) { m.className = 'msg e'; m.textContent = 'Nómina no válida.'; return; }
    if (String(F.p.value).length < 6) { m.className = 'msg e'; m.textContent = 'La contraseña inicial debe tener al menos 6 caracteres.'; return; }
    m.className = 'msg'; m.textContent = 'Creando acceso…';
    try { const r = await window.LI.crearCuenta(k, F.p.value); const adm = F.r.value === 'admin';
      D.usuarios[k] = { n: F.m.value.trim().toUpperCase(), r: F.r.value, a: true, cargar: adm || F.c.checked, eliminar: adm || F.e.checked }; guardar();
      toast('✔ ' + D.usuarios[k].n + (r === 'existe' ? ' ya tenía cuenta: entra con su contraseña de siempre.' : ' entra con la contraseña inicial.'));
    } catch (x) { m.className = 'msg e'; m.textContent = x.message || x; }
  };
  // datos de la caja
  $('#fJ').onsubmit = e => { e.preventDefault(); const F = e.target; D.fondo = r2(F.fo.value) || D.fondo; D.responsable = F.re.value.trim(); D.diasEntrega = Number(F.de.value) || 7; D.diasCheque = Number(F.dc.value) || 7; D.alertaPct = Number(F.ap.value) || 30; guardar(); toast('✔ Datos de la caja guardados'); };
  $('#jCar').onclick = elegirCarpeta;
  $('#jXls').onclick = async () => { if (soporta) await pedirPermiso(); actualizarExcel(true); };
  $('#jRes').onclick = () => { const x = {}; ['fondo', 'responsable', 'diasEntrega', 'diasCheque', 'alertaPct'].concat(COLS).forEach(k => x[k] = D[k]); const b = new Blob([JSON.stringify(x, null, 1)], { type: 'application/json' }); if (carpeta) escribirArchivo('caja-chica-respaldo-' + hoyISO() + '.json', b).then(() => toast('Respaldo guardado en CAJA CHICA')).catch(() => descargar(b, 'caja-chica-respaldo-' + hoyISO() + '.json')); else descargar(b, 'caja-chica-respaldo-' + hoyISO() + '.json'); };
  $('#jImp').onchange = async e => { const f = e.target.files[0]; if (!f) return; if (!confirm('Importar reemplaza las facturas, entregas, vales y adeudos actuales por los del archivo. ¿Continuar?')) return; try { importar(JSON.parse(await f.text())); toast('✔ Respaldo importado'); } catch (x) { toast('No se pudo leer: ' + x.message); } };
  // eliminados
  $$('#t-config [data-rest]').forEach(b => b.onclick = () => { const e = D.eliminados.find(x => x.id === b.dataset.rest); if (!e) return;
    D.facturas.push(Object.assign({}, e.datos, { id: e.ref || nuevoId('g') })); e.restaurado = true; e.restT = new Date().toISOString(); e.restPor = YO.nom; guardar(); toast('✔ Factura restaurada'); });
  // entradas
  const A = await leerAccesos(), box = $('#accesos'); if (!box) return;
  box.innerHTML = A.length ? '<div class="tw" style="max-height:420px;overflow:auto"><table><thead><tr><th>Fecha y hora</th><th>Nómina</th><th>Nombre</th><th>Equipo</th></tr></thead><tbody>' +
    A.map(a => { const d = new Date(a.t); return '<tr><td style="white-space:nowrap">' + d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) + '</td><td>' + esc(a.nom) + '</td><td>' + esc((D.usuarios[a.nom] || {}).n || a.n) + '</td><td>' + esc(a.eq || '') + '</td></tr>'; }).join('') + '</tbody></table></div>'
    : 'Aún no hay entradas registradas.';
}

// ===================== arranque =====================
// la sesión (nómina + contraseña) la maneja li-firebase.js; al entrar se conectan los datos en vivo
if (window.claude && window.LI) conectar();
else document.querySelector('main').innerHTML = '<div class="card vacio" style="margin-top:20px"><span class="e">🌐</span>Abre la caja chica desde su liga en internet (no como archivo).</div>';
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
