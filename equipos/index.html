<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base de Datos LI · Equipos de planta</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0E2A47"><link rel="icon" href="icono-192.png"><link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Base de Datos LI">
<style>
:root{
  --bg:#EEF2F6;--card:#fff;--ink:#14212E;--muted:#5B6B7B;--line:#D8E0E8;
  --navy:#0E2A47;--azul:#1F6FD1;--azul-s:#E3EEFB;--ambar:#F5A623;--ambar-s:#FFF3DC;--verde:#1E8E5A;--verde-s:#E1F4EA;--rojo:#C62828;--rojo-s:#FDE5E5;
  --sombra:0 1px 2px rgba(14,42,71,.06),0 8px 22px rgba(14,42,71,.08);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 60px}
header.top{background:radial-gradient(1200px 300px at 80% -60%,#2a5a8f 0,transparent 60%),linear-gradient(120deg,#0B1F35,#0E2A47 55%,#173E66);color:#EAF2FB;padding:14px 0 16px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:auto -10% 0 -10%;height:3px;background:linear-gradient(90deg,transparent,#3FC1C9,var(--ambar),transparent);animation:chispa 4s linear infinite}
@keyframes chispa{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.top .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-bottom:0}
.top h1{margin:0;font-size:23px;letter-spacing:.01em}.top p{margin:2px 0 0;opacity:.8;font-size:13px}.esp{flex:1}
.logo{width:46px;height:46px;border-radius:10px;background:#fff1;border:1px solid #fff3;display:grid;place-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;cursor:pointer}
nav.tabs{position:sticky;top:0;z-index:50;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding:6px 16px;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:14.5px}
nav.tabs button.on{background:var(--navy);color:#fff}
nav.tabs button:not(.on):hover{background:#EEF2F6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sombra);padding:18px}
h2{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h3{margin:16px 0 8px;font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid #C7D2DE;background:#fff;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;transition:transform .12s,background .12s}
.btn:hover{background:#F3F6FA}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}.btn.pri:hover{background:#1A5FB4}
.btn.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.peligro{color:var(--rojo);border-color:#E9B4B4}
.btn.big{padding:13px 20px;font-size:16px;border-radius:12px}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
input[type=text],input[type=number],input[type=search],input:not([type]),select,textarea{border:1px solid #C7D2DE;border-radius:10px;padding:9px 11px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #9CC2F0;border-color:var(--azul)}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
/* ---- búsqueda ---- */
.hero{margin:18px 0 14px;padding:26px 26px 22px;border-radius:22px;color:#EAF2FB;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(14,42,71,.28);
  background:radial-gradient(700px 260px at 85% 0%,rgba(63,193,201,.28),transparent 60%),radial-gradient(500px 240px at 0% 100%,rgba(245,166,35,.16),transparent 60%),linear-gradient(125deg,#0B1F35,#0E2A47 50%,#1A4877)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(90deg,transparent,#000 55%);pointer-events:none}
.hero::after{content:"";position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(180deg,transparent,rgba(63,193,201,.16),transparent);animation:escaneo 5s linear infinite;pointer-events:none}
@keyframes escaneo{to{top:110%}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,300px);gap:22px;align-items:center}.hero .hcont{position:relative;z-index:1;min-width:0;order:0}
.hero .eti{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9FE3E7;background:rgba(63,193,201,.14);border:1px solid rgba(63,193,201,.35);border-radius:99px;padding:3px 10px}
.hero .eti i{width:8px;height:8px;border-radius:50%;background:#3FC1C9;box-shadow:0 0 0 0 rgba(63,193,201,.7);animation:latido 1.8s infinite}
@keyframes latido{70%{box-shadow:0 0 0 9px rgba(63,193,201,0)}100%{box-shadow:0 0 0 0 rgba(63,193,201,0)}}
.hero h2{font-size:31px;line-height:1.15;margin:10px 0 4px;color:#fff;letter-spacing:-.01em}
.hero h2 span{background:linear-gradient(90deg,#F5A623,#FFD27A);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin:0;color:#B8CBE0;font-size:14.5px}
.hero .maqs{position:relative;order:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:center;z-index:0;opacity:.95}
.hero .maqs div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;display:grid;place-items:center;padding:6px;animation:flota 6s ease-in-out infinite}
.hero .maqs div:nth-child(2n){animation-delay:-2s}.hero .maqs div:nth-child(3n){animation-delay:-4s}
.hero .maqs svg{width:100%;height:auto;max-height:64px}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.buscador{position:relative;margin-top:14px;max-width:620px}
.buscador input{font-size:17px;padding:12px 14px 12px 50px;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:#fff;color:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.25)}
.buscador input:focus{border-color:#3FC1C9;outline:none;box-shadow:0 0 0 6px rgba(63,193,201,.28),0 10px 26px rgba(0,0,0,.25)}
.buscador .lupa{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;animation:lupa 2.8s ease-in-out infinite;z-index:1}
@keyframes lupa{0%,100%{transform:translateY(-50%) rotate(0)}50%{transform:translateY(-50%) rotate(-14deg)}}
.ejemplos{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;align-items:center}
.ejemplos .lbl{font-size:12.5px;color:#9FB6CF;font-weight:600}
.ejemplos button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);border-radius:99px;padding:4px 12px 4px 9px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;display:inline-flex;align-items:center;gap:6px;transition:background .15s,transform .15s}
.ejemplos button:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.ejemplos button i{width:9px;height:9px;border-radius:50%;background:var(--c,#3FC1C9)}
.hero .pie{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
.hero .pie .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}.hero .pie .btn:hover{background:rgba(255,255,255,.2)}
.hero .pie span{color:#9FB6CF;font-size:13px}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero .maqs{display:none}.hero h2{font-size:25px}.hero{padding:20px 16px 18px}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sombra)}
.stat b{display:block;font-size:26px;line-height:1.1}.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
/* ---- categorías ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{--c:#1F6FD1;position:relative;border:0;border-radius:18px;padding:14px 14px 12px;background:#fff;box-shadow:var(--sombra);cursor:pointer;text-align:left;overflow:hidden;transition:transform .18s,box-shadow .18s;border-top:5px solid var(--c);animation:sube .45s both;animation-delay:calc(var(--i,0)*45ms)}
.tile:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 14px 30px rgba(14,42,71,.16)}
.tile .ic{width:104px;height:86px;color:var(--c);transition:transform .3s;filter:drop-shadow(0 4px 6px rgba(14,42,71,.18))}
.tile:hover .ic{transform:scale(1.08) translateY(-2px)}
.tile b{display:block;font-size:15px;margin-top:4px}.tile small{color:var(--muted);font-weight:600}
.tile .n{position:absolute;right:12px;top:10px;font-size:24px;font-weight:800;color:var(--c)}
.tile::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.07}
.tile.sel{outline:3px solid var(--c)}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ---- tarjetas de equipo ---- */
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.eq{--c:#1F6FD1;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:var(--sombra);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;animation:sube .35s both;animation-delay:calc(min(var(--i,0),20)*25ms)}
.eq:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(14,42,71,.15)}
.eq .foto{height:140px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,#fff),#fff);display:grid;place-items:center;position:relative}
.eq .foto img{width:100%;height:100%;object-fit:cover}
.eq .foto svg{width:132px;height:110px;color:var(--c);filter:drop-shadow(0 5px 8px rgba(14,42,71,.2))}
.clave{display:inline-flex;align-items:center;gap:4px;background:var(--c);color:#fff;font-weight:800;border-radius:8px;padding:2px 9px;font-size:14px;letter-spacing:.04em;font-family:Consolas,"Segoe UI",monospace}
.eq .foto .clave{position:absolute;left:10px;top:10px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:15px}
.eq .foto .bad{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
.bad span{background:#ffffffe6;border-radius:99px;padding:1px 7px;font-size:12px;font-weight:700}
.eq .cuerpo{padding:10px 12px 12px}
.eq .cuerpo b{display:block;font-size:15px;line-height:1.25}
.eq .cuerpo small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700;background:#EEF2F6;color:#3A4B5C}
.pill.v{background:var(--ambar-s);color:#8A5A00}
mark{background:#FFF0A8;border-radius:3px;padding:0 1px}
/* ---- áreas ---- */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.area{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center;box-shadow:var(--sombra);transition:transform .15s;animation:sube .35s both;animation-delay:calc(min(var(--i,0),30)*15ms)}
.area:hover{transform:translateY(-2px)}
.area .pin{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#E1F4EA;font-size:22px;flex:none}
.area b{display:block;line-height:1.2}.area .mini{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.area .mini i{font-style:normal;font-size:11px;font-weight:800;color:#fff;border-radius:5px;padding:0 5px}
/* ---- ficha ---- */
#modal{position:fixed;inset:0;z-index:200;background:rgba(9,20,34,.55);display:none;overflow:auto;padding:18px 10px}
#modal.on{display:block;animation:fondo .2s}
@keyframes fondo{from{background:rgba(9,20,34,0)}}
.hoja{max-width:1000px;margin:0 auto;background:var(--bg);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:entra .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes entra{from{transform:translateY(40px) scale(.97);opacity:0}}
.hoja .cab{--c:#1F6FD1;background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 60%,#0B1F35));color:#fff;padding:18px 20px;display:flex;gap:14px;align-items:center;position:relative}
.hoja .cab .ic{width:96px;height:80px;color:#fff;flex:none;background:#ffffff24;border-radius:14px;padding:4px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.hoja .cab h2{margin:0;font-size:22px;color:#fff}.hoja .cab p{margin:2px 0 0;opacity:.85;font-size:13.5px}
.hoja .cab .clave{background:#fff;color:var(--c);font-size:22px;padding:4px 12px}
.hoja .cab .x{position:absolute;right:12px;top:12px;border:0;background:#ffffff26;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
.hoja .cuerpo{padding:16px;display:grid;gap:14px}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.fotos2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.fotos2{grid-template-columns:1fr}}
.marco{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sombra)}
.marco .t{padding:8px 12px;font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.marco .t span{display:flex;gap:4px}
.marco .img{height:260px;background:#F4F7FA;display:grid;place-items:center;cursor:zoom-in;position:relative}
.marco .img img{width:100%;height:100%;object-fit:contain}
.marco .vacio{text-align:center;color:var(--muted);padding:10px}
.marco .vacio svg{width:70px;height:70px;opacity:.5}
/* placa metálica */
.placa{position:relative;border-radius:14px;padding:18px 22px 16px;background:linear-gradient(160deg,#F4F6F8 0%,#D5DBE1 35%,#EEF1F4 55%,#C3CAD2 100%);border:1px solid #9AA5B1;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 6px rgba(0,0,0,.12),0 6px 18px rgba(14,42,71,.12);color:#1D2833;overflow:hidden}
.placa::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 3px);pointer-events:none}
.placa::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:brillo 5s ease-in-out infinite;pointer-events:none}
@keyframes brillo{0%,60%{left:-60%}100%{left:130%}}
.placa .rem{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#8995A1 60%,#5D6874);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.placa .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid #6B7682;padding-bottom:8px;margin-bottom:10px;position:relative}
.placa .ph b{font-size:22px;letter-spacing:.06em;text-transform:uppercase;font-family:"Arial Black",Arial,sans-serif}
.placa .ph span{font-size:12px;font-weight:700;color:#3C4855;text-align:right}
.placa dl{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 18px;position:relative}
.placa dl div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #8C97A3;padding:4px 0}
.placa dt{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#46525F}
.placa dd{margin:0;font-family:Consolas,"Courier New",monospace;font-weight:700;font-size:14px;text-align:right;word-break:break-word}
.placa dd.no{color:#8C97A3;font-weight:400}
.placa .ver{background:#FFE29A;border-radius:4px;padding:0 3px}
.datos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.dato{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 11px}
.dato span{display:block;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dato b{font-weight:600;word-break:break-word}
.per{display:inline-block;border-radius:7px;padding:1px 8px;margin:2px 3px 0 0;font-size:12.5px;font-weight:800;color:#fff}
.dato span.per{display:inline-block;color:#fff;font-size:12px;letter-spacing:0}
.pag{display:block;margin:0 auto 14px;max-width:100%;box-shadow:0 4px 18px rgba(0,0,0,.25);background:#fff}
.salud{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.anillo{position:relative;width:150px;height:150px;flex:none;background:#fff;border:1px solid var(--line);border-radius:16px;display:grid;place-items:center}
.anillo svg{width:132px;height:132px}
.anillo svg circle+circle{animation:llena 1.4s cubic-bezier(.2,.8,.2,1) .2s forwards}
@keyframes llena{to{stroke-dashoffset:var(--fin)}}
.anillo div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.anillo b{font-size:36px;line-height:1}.anillo span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}
.sd{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px #fff}
/* refacciones */
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mans{display:grid;gap:8px}
.man{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-left:5px solid #1F6FD1;border-radius:12px;padding:10px 12px;background:#fff;flex-wrap:wrap}
.man .mi{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:#EEF4FC;border-radius:10px}
.man .mt{flex:1;min-width:180px}.man .mt b{display:block}.man .mt span{font-size:12.5px;color:var(--muted)}
.man .ma{display:flex;gap:6px}
.editable [data-ed]{cursor:pointer;position:relative;border-radius:8px;transition:background .12s}.editable [data-ed]:hover{background:rgba(31,111,209,.08);outline:2px dashed #9CC2F0;outline-offset:1px}.editable [data-ed]::after{content:'✏';position:absolute;right:5px;top:3px;font-size:11px;opacity:.5}.editable .cab [data-ed]::after{color:#fff;opacity:.8}.editable [data-ed]:has(.edin)::after{display:none}.editable [data-ed]:has(.edin){grid-column:1/-1;outline:0;background:none}.editable [data-ed]:has(.edin)>:not(.edin){display:none}.edin{background:#fff;color:var(--ink);border:2px solid var(--azul);border-radius:10px;padding:8px;box-shadow:var(--sombra);font-size:14px;font-weight:400;text-align:left}.edin input,.edin textarea{width:100%;border:1px solid #C7D2DE;border-radius:8px;padding:7px 9px;font-size:15px}
.visorman{align-items:center}.visorman input{border:1px solid #C7D2DE;border-radius:8px;padding:6px}
.ref{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sombra)}
.ref .img{height:130px;background:#F4F7FA;display:grid;place-items:center;cursor:zoom-in}
.ref .img img{width:100%;height:100%;object-fit:contain}
.ref .c{padding:8px 10px;font-size:13.5px}.ref .c b{display:block;font-size:14.5px}
.ref .mod{font-family:Consolas,monospace;font-weight:700;background:#EEF2F6;border-radius:6px;padding:1px 6px;display:inline-block;margin-top:3px}
/* historial */
.tl{position:relative;margin:0;padding:0 0 0 22px;list-style:none}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:#D8E0E8;border-radius:3px}
.tl li{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.tl li::before{content:"";position:absolute;left:-19px;top:13px;width:11px;height:11px;border-radius:50%;background:var(--pc,#1F6FD1);box-shadow:0 0 0 3px #fff}
.barra{height:8px;border-radius:99px;background:#E6ECF2;overflow:hidden;margin-top:5px}
.barra i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F5A623,#1E8E5A)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th{background:#EEF2F6;text-align:left;padding:7px 8px;font-size:12px;color:#3A4B5C;position:sticky;top:0}
table.t td{border-bottom:1px solid #E6ECF2;padding:6px 8px;vertical-align:top}
.tabla{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
/* semana */
.semana{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.dia{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--sombra)}
.dia.hoy{outline:3px solid var(--azul)}
.dia h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between}
.act{display:flex;gap:6px;align-items:flex-start;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:13px;border-left:4px solid var(--c,#999);background:#F7F9FB;margin-bottom:5px}
.act:hover{background:#EEF4FB}
.act .pct{margin-left:auto;font-weight:800;font-size:12px;white-space:nowrap}
/* avisos */
.aviso{border-radius:14px;padding:12px 14px;margin:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.aviso.verde{background:var(--verde-s);border:1px solid #9FD6B9}
.aviso.ambar{background:var(--ambar-s);border:1px solid #F3CF8C}
.aviso.azul{background:var(--azul-s);border:1px solid #A8C8F0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#14212E;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:sube .25s}
#visor{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.9);display:grid;place-items:center;cursor:zoom-out}
#visor img{max-width:96vw;max-height:94vh;object-fit:contain}
#nomina{position:fixed;inset:0;z-index:150;background:linear-gradient(135deg,#0B1F35,#173E66);display:grid;place-items:center;padding:16px}
#nomina .card{width:min(400px,100%);text-align:center}
#nomina input{font-size:24px;text-align:center;letter-spacing:.1em}
.formsec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.formsec h4{margin:0 0 8px;font-size:14px;display:flex;gap:6px;align-items:center}
.chk{display:inline-flex;gap:5px;align-items:center;border:1px solid #C7D2DE;border-radius:99px;padding:4px 10px;margin:3px;font-size:13px;font-weight:600;cursor:pointer;background:#fff}
.chk input{margin:0}
.fotoin{display:flex;gap:10px;align-items:center}
.fotoin .prev{width:90px;height:70px;border-radius:10px;background:#F4F7FA;border:1px dashed #C7D2DE;display:grid;place-items:center;overflow:hidden;flex:none}
.fotoin .prev img{width:100%;height:100%;object-fit:cover}
#print{display:none}
@media print{
  @page{size:letter;margin:11mm}
  body>*:not(#print){display:none!important}
  #print{display:block;font:10.5px/1.4 "Segoe UI",Arial,sans-serif;color:#000}
  #print .hojaimp{page-break-after:always;text-align:center}#print .hojaimp:last-child{page-break-after:auto}#print .hojaimp img{width:100%;max-height:257mm;object-fit:contain}
  #print .pc{display:flex;gap:12px;align-items:center;border-bottom:3px solid #0E2A47;padding-bottom:6px;margin-bottom:8px}
  #print .pc .cl{font:800 26px Consolas,monospace;border:2px solid #000;border-radius:6px;padding:2px 10px}
  #print h1{font-size:18px;margin:0}#print h3{font-size:13px;margin:10px 0 4px;border-bottom:1px solid #999}
  #print .fx{display:flex;gap:10px}#print .fx>div{flex:1;border:1px solid #bbb;border-radius:6px;padding:4px;text-align:center}
  #print .fx img{max-width:100%;max-height:200px;object-fit:contain}
  #print table{border-collapse:collapse;width:100%}#print td,#print th{border:1px solid #bbb;padding:3px 5px;text-align:left;vertical-align:top}#print th{background:#eee}
  #print .rf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}#print .rf div{border:1px solid #bbb;border-radius:5px;padding:4px;break-inside:avoid}#print .rf img{width:100%;height:80px;object-fit:contain}
  #print .etq{display:inline-flex;gap:10px;align-items:center;border:2px dashed #000;border-radius:10px;padding:10px 14px;margin:6px;break-inside:avoid}
  #print .etq b{font:800 30px Consolas,monospace;display:block}
  #print .firmas{display:flex;gap:30px;margin-top:26px}#print .firmas div{flex:1;border-top:1px solid #000;text-align:center;padding-top:3px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  cv.width = cv.height = (n + 2 * m) * t; const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.fillStyle = '#0B1F35';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + m) * t, (r + m) * t, t, t);
  return cv.toDataURL('image/png');
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const IDB = (() => { let p; const abrir = () => p || (p = new Promise((ok, no) => { const r = indexedDB.open('equipos-li', 2); r.onupgradeneeded = () => { ['fotos', 'kv', 'manuales'].forEach(n => { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); }); }; r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }));
  const op = (st, modo, fn) => abrir().then(db => new Promise((ok, no) => { const t = db.transaction(st, modo); const q = fn(t.objectStore(st)); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error); }));
  return { get: (st, k) => op(st, 'readonly', s => s.get(k)).catch(() => undefined), set: (st, k, v) => op(st, 'readwrite', s => s.put(v, k)).catch(() => {}) }; })();
const FOTOS = {};
function foto(id) {

// comprime la foto a 1000 px y ≈150 KB (JPEG) para guardarla en la base
function comprimir(file, lado = 1000, maxB = 160000) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, lado / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      let q = 0.78, d = cv.toDataURL('image/jpeg', q);
      while (d.length > maxB * 1.37 && q > 0.3) { q -= 0.08; d = cv.toDataURL('image/jpeg', q); }
      ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('La imagen no se pudo leer')); };
    img.src = url;
  });
}

}

function buscar(q, base = lista()) {

    if (!toks.every(t => pajar.includes(t) || pajar.replace(/[^a-z0-9]/g, '').includes(t.replace(/[^a-z0-9]/g, '')))) return null;
    let s = 0; if (cl === qc) s = 1000; else if (cl.startsWith(qc)) s = 600; else if (cl.endsWith(qc)) s = 500; else if (cl.includes(qc)) s = 400;

}

// ===================== salud, vida útil y depreciación =====================
const isoD = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

function vidaHoras(e) { const c = norm(e.corto); if (e.cat === 'EA' && /compresor/.test(c)) return 60000; if (e.cat === 'EM' && /montacargas/.test(c)) return 20000; return null; }

function calcVida(m) {

  if (dm.length) imp = dm.reduce((s, x) => s + +x.min, 0) / dm.reduce((s, x) => s + +x.prog, 0);
  else { const u = disp.filter(x => x.pct != null).sort((a, b) => String(b.per).localeCompare(String(a.per)))[0]; if (u) imp = +u.pct; }
  if (imp != null) pts.disp = cl(25 * (1 - imp / c.impTope));

function salud(e) {

// lee las hojas mensuales del PLAN MAESTRO (bloques por semana: fila de fechas, fila "EQUIPOS | OT | BITÁCORA FÍSICA | EM | % EJECUCIÓN | FR | CAT")
async function importarPlan(buf, nombre) {
  toast('📥 Leyendo ' + nombre + '…', 4000);
  try { await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'); } catch (x) { return toast('⚠ No se pudo cargar el lector de Excel'); }
  const wb = new ExcelJS.Workbook(); await wb.xlsx.load(buf);
  const val = c => { let v = c && c.value; if (v && typeof v === 'object' && !(v instanceof Date)) v = v.result !== undefined ? v.result : v.richText ? v.richText.map(x => x.text).join('') : v.text !== undefined ? v.text : ''; return v == null ? '' : v; };
  const fecha = v => { if (v instanceof Date) return v.toISOString().slice(0, 10); if (typeof v === 'number' && v > 30000) return new Date(Date.UTC(1899, 11, 30) + v * 864e5).toISOString().slice(0, 10); return ''; };
  const porMes = {};
  wb.worksheets.forEach(ws => {
    if (!/^(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)\s+\d{4}$/i.test(ws.name.trim())) return;
    const filasH = [];
    ws.eachRow((row, r) => { row.eachCell((c, k) => { if (String(val(c)).trim().toUpperCase() === 'EQUIPOS') filasH.push([r, k]); }); });
    const filasUnicas = [...new Set(filasH.map(x => x[0]))].sort((a, b) => a - b);
    filasH.forEach(([r, k]) => {
      const f = fecha(val(ws.getCell(r - 1, k))); if (!f) return;
      const fin = filasUnicas.find(x => x > r) || ws.rowCount + 1;
      for (let i = r + 1; i < fin - 2; i++) {
        const eq = String(val(ws.getCell(i, k))).trim(); if (!eq || /sin actividades|^semana/i.test(eq)) continue;
        if (!eq.includes('·')) continue;
        const ref = eq.split('·').pop().trim(), corto = eq.slice(0, eq.lastIndexOf('·')).trim();
        const g = j => String(val(ws.getCell(i, k + j))).trim();
        (porMes[f.slice(0, 7)] = porMes[f.slice(0, 7)] || []).push({ f, eq, k: llavePlan(corto, ref), ot: g(1), bit: g(2), em: g(3), pct: Number(g(4)) || 0, fr: g(5), cat: g(6) });
      }
    });
  });
  const ms = Object.keys(porMes).sort();
  if (!ms.length) return toast('⚠ No encontré hojas de meses con actividades en ese archivo');
  const imp = Object.assign(sello(), { arch: nombre });
  for (const mm of ms) await DB.doc('hist/' + mm).set({ r: porMes[mm], imp });
  ms.forEach(mm => D.hist[mm] = { r: porMes[mm], imp });
  const tot = ms.reduce((s, mm) => s + porMes[mm].length, 0), sinEq = Object.values(porMes).flat().filter(r => !equipoDePlan(r)).length;
  registrarCambio('Plan maestro', { id: '-', clave: '-', cat: '-' }, nombre + ': ' + tot + ' actividades (' + ms.join(', ') + ')');
  toast('✅ Programa cargado: ' + tot + ' actividades de ' + ms.length + ' meses' + (sinEq ? ' · ' + sinEq + ' sin equipo identificado' : ''), 6000);
  pintar();
}

      if (typeof v === 'string' && /^-?\d+(\.\d+)?$/.test(v) && !TXT.includes(k)) v = +v;

      (e.fm ? 'Sí' : 'No') + ' / ' + (e.fp ? 'Sí' : 'No'), (e.refs || []).length, realizados(e).length, e.mod ? horaTxt(e.mod.t) + ' · ' + (e.mod.n || e.mod.por || '') : '']
      .forEach((v, i) => { const c = inv.getCell(r, 31 + i); c.value = v === '' ? null : v; if (r === hr + 1 || !c.style || !Object.keys(c.style).length) c.style = estilo(inv.getCell(r, 30)); });

const aBase64 = blob => new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1]); fr.onerror = no; fr.readAsDataURL(blob); });
async function actualizarExcel(elegir) {
  const est = $('#xEst'), avisa = t => { if (est) est.textContent = t; toast(t, 4000); };
  if (!window.showOpenFilePicker) return avisa('⚠ Para actualizar el Excel abre la app en Edge o Chrome de una computadora.');
  try {
    let h = elegir ? null : await IDB.get('kv', 'xlsBase');
    if (h && (await h.queryPermission({ mode: 'readwrite' })) !== 'granted' && (await h.requestPermission({ mode: 'readwrite' })) !== 'granted') h = null;
    if (!h) {
      avisa('📁 Elige tu archivo Base de Datos Actualizado.xlsx (MANTENIMIENTO 2026 › BASE DE DATOS PLANTA)');
      [h] = await window.showOpenFilePicker({ types: [{ description: 'Excel', accept: { [XLSX_TIPO]: ['.xlsx'] } }], excludeAcceptAllOption: true });
      if ((await h.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('Sin permiso para escribir el archivo');
      await IDB.set('kv', 'xlsBase', h);
    }
    avisa('⏳ Actualizando ' + h.name + '…');
    const r = await rellenarExcel(await (await h.getFile()).arrayBuffer());
    const w = await h.createWritable(); await w.write(r.blob); await w.close();
    // respaldo en la nube: es la versión que descargan todos (la anterior queda como respaldo)
    const b64 = await aBase64(r.blob), meta = Object.assign(sello(), { nombre: h.name, kb: Math.round(r.blob.size / 1024), dia: hoyISO(), filas: r.filas });
    if (b64.length < 950000) { try { const a = await DB.doc('excel/actual').get(); if (a.exists) await DB.doc('excel/anterior').set(a.data()); } catch (x) {} await DB.doc('excel/actual').set(Object.assign({ b64 }, meta)); }
    D.excel = meta; await DB.doc('config/ajustes').set(Object.assign({}, D.ajustes, { ultExcel: meta })).catch(() => {});
    registrarCambio('Excel actualizado', { id: '-', clave: '-', cat: '-' }, h.name + ': ' + r.filas + ' equipos, ' + r.nuevos + ' nuevos, ' + r.cambiados + ' celdas cambiadas');
    avisa('✅ Excel actualizado: ' + r.filas + ' equipos · ' + r.nuevos + ' nuevos · ' + r.cambiados + ' celdas cambiadas');

async function descargarExcel() {
  try {
    const s = await DB.doc('excel/actual').get();
