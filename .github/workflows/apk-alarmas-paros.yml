name: APK Alarmas Paros LI

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk-alarmas-paros.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Nombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AlarmasParosLI.apk
      - name: Publicar para descargar en la tableta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alarmas-paros-${{ github.run_number }}
          name: Alarmas Paros LI · prueba ${{ github.run_number }}
          body: Aplicación Android de prueba que vigila las fallas de Control de Paros y abre la alarma a pantalla completa.
          files: AlarmasParosLI.apk
          make_latest: true
